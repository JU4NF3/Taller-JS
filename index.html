 <!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cálculo de Nómina</title>
  <link rel="stylesheet" href="estilos.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
</head>
<body>
    <script src="Variables.js"></script>
    
    <section>
        <div>
     <h1>Información</h1>
    <form action="/procesar_formulario.php" method="post">
        
        <label for="nombreCompleto">Nombre Completo:</label>
        <input type="text" id="nombreCompleto" name="nombreCompleto" required minlength="5" maxlength="50"  pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ ]+">

        <label for="edad">Edad:</label>
        <input type="number" id="edad" name="edad" required min="18" max="100" pattern="[0-9]+">

 
      <form class="payroll-form" action="/procesar_formulario.php" method="post">
        <script src="Variables.js"></script>
 
        <div class="form-field compact-field">
          <label for="nombreCompleto">Nombre completo</label>
          <div class="input-icon">
            <i class="ti ti-user"></i>
            <input type="text" id="nombreCompleto" name="nombreCompleto" placeholder="Juan Pérez" required>
          </div>
        </div>
 
        <div class="two-col">
          <div class="form-field">
            <label for="edad">Edad</label>
            <input type="number" id="edad" name="edad" placeholder="25" required>
          </div>
          <div class="form-field">
            <label for="tipoDocumento">Tipo documento</label>
            <input type="text" id="tipoDocumento" name="tipoDocumento" placeholder="CC" required>
          </div>
        </div>
 
        <div class="form-field compact-field">
          <label for="numeroDocumento">Número de documento</label>
          <div class="input-icon">
            <i class="ti ti-id"></i>
            <input type="text" id="numeroDocumento" name="numeroDocumento" placeholder="1234567890" required>
          </div>
        </div>
 
        <div class="two-col">
          <div class="form-field">
            <label for="salario">Salario (COP)</label>
            <input type="number" id="salario" name="salario" placeholder="2.500.000" required>
          </div>
          <div class="form-field">
            <label for="comisiones">Comisiones</label>
            <input type="number" id="comisiones" name="comisiones" placeholder="0" required>
          </div>
        </div>
 
        <div class="two-col">
          <div class="form-field">
            <label for="totalHorasExtra">Horas extra</label>
            <input type="number" id="totalHorasExtra" name="totalHorasExtra" placeholder="0" required>
          </div>
          <div class="form-field">
            <label for="nivelRiesgo">Nivel de riesgo ARL</label>
            <select id="nivelRiesgo" name="nivelRiesgo" required>
              <option value="" disabled selected>Seleccione</option>
              <option value="muyBajo">I — 0.522%</option>
              <option value="bajo">II — 1.044%</option>
              <option value="medio">III — 2.436%</option>
              <option value="alto">IV — 4.350%</option>
              <option value="muyAlto">V — 6.960%</option>
            </select>
          </div>
        </div>
 
        <button class="submit-btn" type="submit">Calcular nómina</button>
 
        <div class="options-row">
          <label><input type="checkbox"> Recordar datos</label>
          <a href="#">¿Olvidaste algo?</a>
        </div>
 
      </form>
 
      <div class="dots">
        <div class="dot on"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
 
    </div>
 
    <div class="hero">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
 
      <div class="hero-text">
        <h2>Bienvenido.</h2>
        <p>Calcula tu nómina de forma rápida y precisa.</p>
        <a href="#" class="cta">Explorar reportes <i class="ti ti-arrow-right"></i></a>
      </div>
    </div>
 
  </div>
 
</body>
</html>
